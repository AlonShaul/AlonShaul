[build]
  functions = "netlify/functions"

# Security headers ברמת הפלטפורמה - חלים על כל הנתיבים באתר.
# CSP מוגדר כרגע במצב Report-Only בלבד: הדפדפן מדווח על חריגות בקונסול אבל לא חוסם דבר.
# המקורות החיצוניים המורשים הם Google Fonts (fonts.googleapis.com / fonts.gstatic.com)
# ו-Font Awesome מ-cdnjs. מעבר ל-Content-Security-Policy אוכף רק לאחר בדיקה בפרודקשן.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=15552000"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data:; media-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
