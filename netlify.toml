[build]
  functions = "netlify/functions"

# Security headers ברמת הפלטפורמה - חלים על כל הנתיבים באתר.
# CSP נאכף: הדפדפן חוסם כל משאב שאינו מורשה במדיניות.
# המקורות החיצוניים המורשים הם Google Fonts (fonts.googleapis.com / fonts.gstatic.com)
# ו-Font Awesome מ-cdnjs. המדיניות נבדקה קודם בפרודקשן במצב Report-Only ללא חריגות.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=15552000"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data:; media-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
